<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#174d70"><title>HHMS</title><link rel="stylesheet" href="./css/app.css"></head><body><header class="topbar"><div class="brand">HHMS</div><div class="topbar-right"><span id="connection-state" class="connection-state">Offline</span><button id="logout" class="link-button hidden">Logout</button></div></header><main class="app-shell"><section id="connection-view" class="panel"><h1>Hospital Server Connection</h1><p>Connect this client to the HHMS server on the hospital LAN.</p><div id="connection-status" class="status-box">Starting connection discovery…</div><label for="server-url">Server address</label><input id="server-url" type="url" placeholder="http://192.168.1.10:8000/api/v1"><div class="button-row"><button id="discover">Discover Server</button><button id="connect">Connect</button><button id="clear" class="secondary">Clear Saved Address</button></div><div id="server-details" class="details hidden"><h2>Connected Server</h2><dl><div><dt>Name</dt><dd id="server-name">—</dd></div><div><dt>Version</dt><dd id="server-version">—</dd></div><div><dt>Address</dt><dd id="server-address">—</dd></div></dl></div></section><section id="login-view" class="panel hidden"><h1>Sign in</h1><p>Use your HHMS account to continue.</p><div id="login-status" class="status-box"></div><form id="login-form"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button id="login" type="submit">Sign in</button></form></section><section id="workspace-view" class="workspace hidden"><aside class="sidebar"><div class="sidebar-title">HHMS</div><button class="nav-item active" data-view="patients">Patients</button><button class="nav-item" disabled>Clinical Modules</button></aside><section class="workspace-main"><div class="workspace-header"><div><h1>Patients</h1><p>Search and open registered patients.</p></div><div id="user-badge" class="user-badge"></div></div><section class="content-panel"><div class="search-row"><input id="patient-search" type="search" placeholder="Search patient number, name or mobile"><button id="patient-search-button">Search</button></div><div id="patient-status" class="status-box"></div><div id="patient-list" class="patient-list"></div></section></section></section></main><script type="module" src="./js/app.js"></script></body></html>
