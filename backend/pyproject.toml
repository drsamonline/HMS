[build-system]
requires = [
    "setuptools>=75.0",
    "wheel>=0.45",
]
build-backend = "setuptools.build_meta"


[project]
name = "hhms"
version = "0.1.0"
description = "Hospital Homoeopathic Management System"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "../LICENSE" }

authors = [
    { name = "Dr. Sohil Momin" },
]

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "aiosqlite>=0.20,<1.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.15,<2.0",
    "PyJWT>=2.10,<3.0",
    "pwdlib[argon2]>=0.2,<1.0",
    "python-multipart>=0.0.20,<1.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "httpx>=0.28,<1.0",
    "ruff>=0.9,<1.0",
]


[project.optional-dependencies.package]
server = [
    "pyinstaller>=6.10,<7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]


[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"


[tool.pytest.ini_options]
testpaths = [
    "tests",
]
asyncio_mode = "auto"