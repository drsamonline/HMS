# ---------------------------------------------------------------------------
# HHMS release pipeline — tag-driven releases
#
# Triggers:
#   * push of a version tag (vX.Y.Z)  -> stable Release vX.Y.Z
#   * push to main                    -> rolling nightly prerelease (tag: nightly)
#   * manual workflow_dispatch        -> rolling nightly prerelease
#   * pull_request                    -> test gate ONLY (no build, no publishing)
#
# Flow:
#   1. `test`     — backend regression suite (CI gate).
#   2. build jobs — dual-platform artifacts in parallel:
#        * Linux   — one-file server bundle via scripts/deploy/build-server.sh
#        * Windows — server EXE + setup installer via scripts/deploy/build-installer.ps1
#   3. `release`  — computes SHA-256 checksums and publishes ONE release:
#        * version-tag push  -> real (non-prerelease) GitHub Release at the tag,
#          marked "latest", named "HHMS <version>".
#        * main push / dispatch -> single rolling prerelease permanently at
#          .../releases/tag/nightly (stable download URL, always overwritten
#          AND always re-pointed at the current commit).
#      Binaries + checksums are ALSO attached to every run as the
#      `latest-build` artifact, downloadable from the Actions run page even
#      if the repo is private (releases would be hidden there).
#
# Publish a version:  git tag v1.0.0 && git push origin v1.0.0
# Old nightlies never accumulate — there is exactly one. Version releases are
# permanent milestones and should be kept.
# ---------------------------------------------------------------------------
name: release

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref, but NEVER cancel a tag release
# midway through publishing — those are permanent milestones.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Least privilege at the top; the release job elevates to `contents: write`.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

jobs:
  test:
    name: Backend regression (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # was @v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # was @v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Run full backend suite
        run: python -m pytest backend/tests -q

  build-server-linux:
    name: Server bundle (Linux)
    needs: test
    # PRs run the test gate only — no artifact builds, no publishing.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # was @v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # was @v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-build.txt
      - name: Install dependencies + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-build.txt
      - name: Build one-file bundle
        run: bash scripts/deploy/build-server.sh
      - name: Smoke-test bundle (first-run bootstrap + health)
        run: ./build/dist/HHMS-Server --smoke-test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # was @v4
        with:
          name: hhms-server-linux
          path: build/dist/HHMS-Server
          if-no-files-found: error
          retention-days: 14

  build-installer-windows:
    name: Windows EXE + installer
    needs: test
    # PRs run the test gate only — no artifact builds, no publishing.
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # was @v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # was @v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-build.txt
      - name: Install dependencies + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-build.txt
      - name: Build server EXE
        shell: pwsh
        run: |
          Set-Location backend/packaging
          python -m PyInstaller --noconfirm --clean `
            --distpath ..\..\build\dist --workpath ..\..\build\work `
            HHMS-Server.spec
          Copy-Item ..\..\VERSION ..\..\build\dist\VERSION
      - name: Build installer (Inno Setup, NSIS fallback)
        shell: pwsh
        run: ./scripts/deploy/build-installer.ps1
      - name: Smoke-test server EXE (first-run bootstrap + health)
        shell: pwsh
        run: ./build/dist/HHMS-Server.exe --smoke-test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # was @v4
        with:
          name: hhms-windows-installer
          path: dist/installer/HHMS-Setup-*.exe
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # was @v4
        with:
          name: hhms-server-windows
          path: build/dist/HHMS-Server.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [build-server-linux, build-installer-windows]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # required: create/delete releases and tags
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # was @v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # was @v4
        with:
          path: artifacts

      - name: Compute SHA-256 checksums
        run: |
          cd artifacts
          find . -type f -print0 | sort -z | xargs -0 sha256sum > ../SHA256SUMS.txt
          cd ..
          echo "---- SHA256SUMS.txt ----"
          cat SHA256SUMS.txt

      # Bundle binaries + checksums into a single Actions artifact so they are
      # always downloadable from the run page (works for private repos too).
      - name: Upload combined latest-build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # was @v4
        with:
          name: latest-build
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/hhms-server-linux/HHMS-Server
            artifacts/hhms-server-windows/HHMS-Server.exe
            artifacts/hhms-windows-installer/*.exe
            SHA256SUMS.txt

      # Resolve what to publish: version-tag push -> stable Release vX.Y.Z;
      # anything else (main push / dispatch) -> one rolling nightly prerelease.
      - name: Resolve release target
        id: target
        run: |
          REF="${GITHUB_REF:-}"
          if [[ "$REF" == refs/tags/v* ]]; then
            VERSION="${REF#refs/tags/}"
            {
              echo "tag=$VERSION"
              echo "prerelease=false"
              echo "make_latest=true"
              echo "name=HHMS $VERSION"
              echo "rolling=false"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "tag=nightly"
              echo "prerelease=true"
              echo "make_latest=false"
              echo "name=HHMS Nightly Build"
              echo "rolling=true"
            } >> "$GITHUB_OUTPUT"
          fi

      # Rolling nightly needs a *moving* ref. GitHub tags are immutable, so
      # delete the previous nightly release (and its tag) before publishing the
      # new one — otherwise the action updates the release body but leaves the
      # tag pinned to the first-ever main push.
      - name: Reset rolling nightly release + tag
        if: steps.target.outputs.rolling == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete nightly --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          # Belt-and-braces: also delete a stale tag if the release was already
          # gone but the tag somehow remained.
          git push origin :refs/tags/nightly || true

      - name: Generate release notes
        run: |
          {
            echo ""
            echo "| File | Platform |"
            echo "| --- | --- |"
            echo "| \`HHMS-Server\` | Linux x86-64 (one-file bundle) |"
            echo "| \`HHMS-Server.exe\` | Windows x64 (portable EXE) |"
            echo "| \`HHMS-Setup-*.exe\` | Windows installer |"
            echo "| \`SHA256SUMS.txt\` | integrity checksums |"
            echo ""
            echo "First run bootstraps the database and loads 2025 demo data automatically."
            echo ""
            echo "Commit: \`${{ github.sha }}\`"
          } > RELEASE_NOTES.md

      # Exactly ONE release per pipeline run — no per-commit snapshot clutter.
      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65   # was @v2
        with:
          tag_name: ${{ steps.target.outputs.tag }}
          target_commitish: ${{ github.sha }}   # pin rolling nightly to current commit
          name: ${{ steps.target.outputs.name }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ steps.target.outputs.prerelease }}
          make_latest: ${{ steps.target.outputs.make_latest }}
          generate_release_notes: ${{ steps.target.outputs.rolling == 'false' }}
          files: |
            artifacts/**/*
            SHA256SUMS.txt
