# ---------------------------------------------------------------------------
# HHMS release pipeline — tag-driven releases (product-owner policy update:
# builds must appear as proper Releases, not clutter of per-commit snapshots).
#
# Triggers:
#   * push of a version tag (vX.Y.Z)  -> stable Release vX.Y.Z
#   * push to main                    -> rolling nightly prerelease (tag: nightly)
#   * manual workflow_dispatch        -> rolling nightly prerelease
#   * pull_request                    -> test + build only (no publishing)
#
# Flow:
#   1. `test`     — backend regression suite (CI gate).
#   2. build jobs — dual-platform artifacts in parallel:
#        * Linux   — one-file server bundle via scripts/deploy/build-server.sh
#        * Windows — server EXE + setup installer via scripts/deploy/build-installer.ps1
#   3. `release`  — computes SHA-256 checksums and publishes ONE release:
#        * version-tag push  -> real (non-prerelease) GitHub Release at the tag,
#          marked "latest", named "HHMS <version>".
#        * main push / dispatch -> single rolling prerelease permanently at
#          .../releases/tag/nightly (stable download URL, always overwritten).
#      Binaries + checksums are ALSO attached to every run as the
#      `latest-build` artifact, downloadable from the Actions run page even
#      if the repo is private (releases would be hidden there).
#
# Publish a version:  git tag v1.0.0 && git push origin v1.0.0
# Old nightlies never accumulate — there is exactly one. Version releases are
# permanent milestones and should be kept.
# ---------------------------------------------------------------------------
name: release

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Backend regression (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Run full backend suite
        run: python -m pytest backend/tests -q

  build-server-linux:
    name: Server bundle (Linux)
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies + PyInstaller
        run: pip install -r backend/requirements.txt -r backend/requirements-build.txt
      - name: Build one-file bundle
        run: bash scripts/deploy/build-server.sh
      - name: Smoke-test bundle (first-run bootstrap + health)
        run: ./build/dist/HHMS-Server --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: hhms-server-linux
          path: build/dist/HHMS-Server

  build-installer-windows:
    name: Windows EXE + installer
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies + PyInstaller
        run: pip install -r backend/requirements.txt -r backend/requirements-build.txt
      - name: Build server EXE
        shell: pwsh
        run: |
          Set-Location backend/packaging
          python -m PyInstaller --noconfirm --clean `
            --distpath ..\..\build\dist --workpath ..\..\build\work `
            HHMS-Server.spec
          Copy-Item ..\..\VERSION ..\..\build\dist\VERSION
      - name: Build installer (Inno Setup, NSIS fallback)
        shell: pwsh
        run: ./scripts/deploy/build-installer.ps1
      - name: Smoke-test server EXE (first-run bootstrap + health)
        shell: pwsh
        run: ./build/dist/HHMS-Server.exe --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: hhms-windows-installer
          path: dist/installer/HHMS-Setup-*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: hhms-server-windows
          path: build/dist/HHMS-Server.exe

  release:
    name: Publish GitHub Release
    needs: [build-server-linux, build-installer-windows]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Compute SHA-256 checksums
        run: |
          cd artifacts
          find . -type f -print0 | xargs -0 sha256sum > ../SHA256SUMS.txt
          cd ..
      # Bundle binaries + checksums into a single Actions artifact so they are
      # always downloadable from the run page (works for private repos too).
      - name: Upload combined latest-build artifact
        uses: actions/upload-artifact@v4
        with:
          name: latest-build
          path: |
            artifacts/hhms-server-linux/HHMS-Server
            artifacts/hhms-server-windows/HHMS-Server.exe
            artifacts/hhms-windows-installer/*.exe
            SHA256SUMS.txt
      # Resolve what to publish: version-tag push -> stable Release vX.Y.Z;
      # anything else (main push / dispatch) -> one rolling nightly prerelease.
      - name: Resolve release target
        id: target
        run: |
          REF="${GITHUB_REF:-}"
          if [[ "$REF" == refs/tags/v* ]]; then
            VERSION="${REF#refs/tags/}"
            echo "tag=$VERSION"      >> "$GITHUB_OUTPUT"
            echo "prerelease=false"  >> "$GITHUB_OUTPUT"
            echo "make_latest=true"  >> "$GITHUB_OUTPUT"
            echo "name=HHMS $VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "tag=nightly"       >> "$GITHUB_OUTPUT"
            echo "prerelease=true"   >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
            echo "name=HHMS Nightly Build" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate release notes
        run: |
          {
            echo ""
            echo "| File | Platform |"
            echo "| --- | --- |"
            echo "| \`HHMS-Server\` | Linux x86-64 (one-file bundle) |"
            echo "| \`HHMS-Server.exe\` | Windows x64 (portable EXE) |"
            echo "| \`HHMS-Setup-*.exe\` | Windows installer |"
            echo "| \`SHA256SUMS.txt\` | integrity checksums |"
            echo ""
            echo "First run bootstraps the database and loads 2025 demo data automatically."
            echo "Commit: ${{ github.sha }}"
          } > RELEASE_NOTES.md
      # Exactly ONE release per pipeline run — no per-commit snapshot clutter.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.target.outputs.tag }}
          name: ${{ steps.target.outputs.name }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ steps.target.outputs.prerelease }}
          make_latest: ${{ steps.target.outputs.make_latest }}
          files: |
            artifacts/**/*
            SHA256SUMS.txt
